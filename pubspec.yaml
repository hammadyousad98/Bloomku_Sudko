name: bloomku
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  go_router: ^17.3.0
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.1.13
  audioplayers: ^6.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10
  google_fonts: ^8.1.0
  shared_preferences: ^2.3.0
  intl: ^0.20.3
  equatable: ^2.0.5
  get_it: ^9.2.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  path: ^1.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  objectbox_generator: ^5.3.2
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/lottie/
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
